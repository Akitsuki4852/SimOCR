name: CodeQL

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # 每周一 04:23 UTC 的定时扫描：抓"依赖/规则库更新后才暴露"的旧问题
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (csharp)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      # 顺序不能变：init → build → analyze。CodeQL 的 C# 提取器要求"编译发生在 init 之后"，
      # 否则它抓不到生成的代码与 WPF 的 XAML 编译产物。
      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: csharp
          build-mode: manual

      - name: Build (Release)
        run: dotnet build SimOCR.slnx -c Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          category: "/language:csharp"
